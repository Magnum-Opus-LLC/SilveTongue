supporting_knowledge:
- 'Lab Experiment: In a reflux setup, maintaining a 5°C temperature gradient across the condenser reduced solvent loss by
  12%.'
- 'Simulation Case: Modeling a CSTR for esterification showed that increasing residence time from 30 to 45 min increased yield
  from 78% to 85%.'
- 'Process Design: A pilot‑scale distillation column with 12 theoretical stages achieved a 99.5% purity for ethanol at 0.5
  bar overhead pressure.'
- 'Safety Drill: Conducting a spill response drill for 1‑M HCl improved cleanup time from 8 to 3 minutes.'
- 'Sustainability Project: Replacing a 10‑kW electric heater with a 5‑kW induction heater cut energy consumption by 50% in
  a 100‑L batch reactor.'
- 'DOE Application: A 2^3 factorial design identified that stirring speed had the largest effect on product yield, with a
  15% increase at 800 rpm.'
- 'Transport Study: Measuring diffusion coefficient of CO₂ in water at 25°C yielded D = 1.9×10⁻⁵ cm²/s, matching literature
  values.'
- 'Catalyst Screening: Using a 5 wt% Pt/C catalyst increased reaction rate by 3× compared to 1 wt%.'
- 'Environmental Assessment: Calculating the E‑factor for a solvent‑based extraction process revealed 0.8 kg waste/kg product,
  prompting solvent recovery.'
- 'Thermodynamic Analysis: Calculating ΔG for the reaction 2H₂ + O₂ → 2H₂O at 298 K gave -571 kJ/mol, confirming spontaneity.'
