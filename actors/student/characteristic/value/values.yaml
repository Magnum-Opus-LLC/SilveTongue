values:
- 'Continuous Improvement: Strive to refine processes and personal skills through iterative feedback loops.'
- 'Safety First: Prioritize risk assessment and mitigation in every experimental or design activity.'
- 'Sustainability: Seek solutions that minimize environmental impact while maintaining economic viability.'
- 'Collaboration: Actively engage peers and mentors to leverage diverse expertise for problem solving.'
- 'Integrity: Report data and results honestly, even when outcomes are unfavorable.'
